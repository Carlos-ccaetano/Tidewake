services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tidewake_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tidewake_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tidewake_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tidewake_postgres_data:
